  h1{

    padding:14px;

    border-radius:8px;

  }

  nav.menu a:hover{
    background:#1a1a1a;

  }

  .divider{
    height:1px;
    background:#e0e0e0;
    margin:24px 0;
  }

  .find-me{
    font-size:13px;
    font-weight:600;
    letter-spacing:2px;
    color:#666;
    margin-bottom:20px;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:36px;
  }

  .socials a img{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:2px solid #eee;
  }

  footer{
    font-size:12px;
    color:#999;
  }

  footer .brand{
    font-weight:600;
    margin-bottom:6px;
    color:#333;
  }
