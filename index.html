<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Baloo 2',sans-serif;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    background:#2fb6c4 url('img/bg-night.gif') center top / cover no-repeat;
    padding:40px 20px 20px;
    position:relative;
    overflow-x:hidden;
  }

  /* garis hijau vertikal di tengah, nembus dari belakang tombol */
  .bgStripe{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:90px;
    height:100%;
    background:#3a9b7a;
    opacity:.55;
    z-index:0;
  }

  .wrapper{
    width:100%;
    max-width:400px;
    text-align:center;
    position:relative;
    z-index:1;
  }

  .avatar{
    width:150px;
    height:150px;
    border-radius:50%;
    background:#ffe9a8;
    border:6px solid #fff;
    overflow:hidden;
    margin:0 auto 20px;
    box-shadow:0 0 25px rgba(255,255,255,0.5);
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  h1{
    font-size:44px;
    font-weight:800;
    color:#fff;
    text-shadow:0 0 18px rgba(255,255,255,0.85), 0 0 4px rgba(255,255,255,0.9);
    margin-bottom:6px;
    line-height:1.1;
  }

  h1 .accent{
    position:relative;
    display:inline-block;
  }

  h1 .accent::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:2px;
    height:10px;
    background:#3a9b7a;
    z-index:-1;
    border-radius:4px;
  }

  nav.menu{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin:34px 0 24px;
  }

  nav.menu a{
    display:block;
    text-decoration:none;
    color:#6b2d8f;
    background:#f5e6a8;
    font-weight:700;
    font-size:16px;
    letter-spacing:1px;
    padding:16px;
    border-radius:999px;
    box-shadow:0 0 16px rgba(255,255,255,0.7), inset 0 0 0 2px rgba(255,255,255,0.6);
    transition:.15s;
  }

  nav.menu a:active{
    transform:scale(0.97);
  }

  .divider{
    height:2px;
    background:rgba(255,255,255,0.5);
    margin:22px auto;
    max-width:340px;
  }

  .find-me{
    font-size:17px;
    font-weight:700;
    letter-spacing:3px;
    color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,0.9);
    margin-bottom:6px;
  }

  .chevron{
    width:16px;
    height:16px;
    margin:0 auto 22px;
    border-right:3px solid #fff;
    border-bottom:3px solid #fff;
    transform:rotate(45deg);
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.9));
  }

  .socialsWrap{
    border:2.5px solid rgba(255,255,255,0.85);
    border-radius:999px;
    padding:14px 20px;
    display:inline-flex;
    gap:16px;
    align-items:flex-end;
    background:rgba(255,255,255,0.05);
    margin-bottom:40px;
  }

  .socialItem{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    text-decoration:none;
  }

  .socialItem img{
    width:52px;
    height:52px;
    border-radius:14px;
    object-fit:cover;
    display:block;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
  }

  .socialItem span{
    font-size:11px;
    font-weight:700;
    color:#fff;
    text-shadow:0 0 6px rgba(255,255,255,0.8);
  }

  footer{
    font-size:12px;
    font-weight:600;
    color:#fff;
    opacity:.8;
    padding-bottom:20px;
  }
</style>

    </a>
    <a href="https://www.instagram.com/llowye_shop" target="_blank" class="socialItem">

      <span>&nbsp;</span>
    </a>
    <a href="https://id.shp.ee/d7yJMj8x" target="_blank" class="socialItem">
      <img src="shopee.jpg" alt="Shopee">
      <span>Shopee</span>
    </a>
  </div>

  <footer>© 2026 Llowye Shop</footer>

</div>
